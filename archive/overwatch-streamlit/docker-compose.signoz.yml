# SigNoz local development stack
# Run: docker compose up -d
# SigNoz UI will be available at http://localhost:3301

version: "3.8"

# Use the official SigNoz install script for a full deployment.
# For quick local dev, you can pull the SigNoz Docker images directly.
#
# Recommended approach:
#   git clone -b main https://github.com/SigNoz/signoz.git && cd signoz/deploy
#   docker compose -f docker/clickhouse-setup/docker-compose.yaml up -d
#
# Or use SigNoz Cloud (free tier): https://signoz.io/teams/
#
# The OTEL collector endpoint for the demo app will be:
#   http://localhost:4318  (HTTP/protobuf)
#
# Once SigNoz is running, start the demo app:
#   python demo/sample_app.py
#
# The demo app sends traces, logs, and metrics to SigNoz via the OTEL collector.
