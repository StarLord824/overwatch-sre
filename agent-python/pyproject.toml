[project]
name = "agent-python"
version = "0.1.0"
description = "Over-Watch SRE agent brain — a direct tool-calling loop over the SigNoz MCP server (OpenSRE-style)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.54.0",
    "mcp>=1.2.0",
    "httpx>=0.28.1",
    "pika>=1.3.2",
    "python-dotenv>=1.2.2",
    "redis>=5.0.1",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.scripts]
overwatch = "cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "cli",
    "agent",
    "eval",
    "knowledge",
    "signoz_mcp",
    "utils",
    "demo",
    "config.py",
    "main.py",
]

[dependency-groups]
demo = [
    "flask>=3.0.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-flask>=0.45b0",
    "requests>=2.32.0",
]
